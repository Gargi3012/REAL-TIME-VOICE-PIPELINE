name: CI/CD Pipeline - Deploy to AWS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Copy files via SSH/SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "app,frontend,scratch,tests,Dockerfile,requirements.txt,locustfile.py,Pillar_2"
        target: "/home/ec2-user/REAL-TIME-VOICE-PIPELINE"

    - name: Run Deploy Script on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 30m
        script: |
          cd /home/ec2-user/REAL-TIME-VOICE-PIPELINE
          # Ensure .env file exists so docker run doesn't fail
          touch .env
          # Build Docker image using the Dockerfile (using sudo for permissions)
          sudo docker build -t voice-pipeline-app .
          # Stop and remove old container if running
          sudo docker stop voice-pipeline || true
          sudo docker rm voice-pipeline || true
          # Run the new container, referencing the .env file (using sudo for permissions)
          sudo docker run -d --name voice-pipeline -p 8000:8000 --env-file .env voice-pipeline-app > /dev/null 2>&1
